[project]
name = "kodax-agent"
version = "0.1.0"
description = "极致轻量化 Coding Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "zhipuai>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
kodax = "kodax_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
