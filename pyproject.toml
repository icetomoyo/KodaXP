[project]
name = "kodaxp"
version = "0.6.2"
description = "极致轻量化 Coding Agent - 单文件实现，支持7种LLM提供商"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "zhipuai>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
kodaxp = "kodax_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
